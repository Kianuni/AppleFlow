name: Validate Rules & Auditor

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify generated rules & modules are in sync
        run: python3 scripts/build_rules.py --check
      - name: Run Config Doctor & Generator unit tests
        run: node tests/test_auditor.mjs
